tasks.named('bootJar') {
    enabled = true
}

dependencies {
    implementation project(':core')
    implementation "org.liquibase:liquibase-core:4.30.0"
    implementation 'org.springframework.boot:spring-boot-starter-security:3.4.1'
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation "org.springframework.cloud:spring-cloud-starter-openfeign:4.2.0"
    testImplementation 'org.testcontainers:postgresql:1.20.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers:3.4.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.4.1'
    testImplementation 'org.springframework.security:spring-security-test:6.4.2'
}


openApiGenerate {
    generatorName = "java"
    inputSpec = "${projectDir}/src/main/resources/openapi.yaml"
    outputDir = "${projectDir}/src/main/generated/openapi"
    apiPackage = "ru.clevertec.api"
    modelPackage = "ru.clevertec.dto"
    invokerPackage = "ru.clevertec.invoker"
    additionalProperties = [
            useLombok: 'true'
    ]
    configOptions = [
            dateLibrary                   : "custom",
            openApiNullable               : "false",
            interfaceOnly                 : "true",
            additionalModelTypeAnnotations: '@lombok.Data @lombok.AllArgsConstructor @lombok.Builder',
            useJakartaEe                  : 'true',
            useSpringBoot3: 'true'
    ]
    generateApiDocumentation = false
    generateApiTests = false
    generateModelTests = false
    typeMappings = [
            "Date": "java.time.LocalDateTime"
    ]
    importMappings = [
            "LocalDateTime": "java.time.LocalDateTime"
    ]
}

sourceSets {
    main {
        java {
            srcDirs += "${projectDir}/src/main/generated/openapi"
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.openApiGenerate
}

tasks.named('test') {
    useJUnitPlatform()
}


